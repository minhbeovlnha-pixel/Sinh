 "26", "prompt": "Câu 26. Ý nghĩa trực tiếp của việc tế bào chỉ tổng hợp sản phẩm gene khi cần thiết, với lượng phù hợp để", "options": [{"label": "A", "text": "làm tăng số lượng gene trong hệ gene."}, {"label": "B", "text": "tiết kiệm năng lượng và giúp tế bào thích nghi với biến đổi của môi trường."}, {"label": "C", "text": "ngăn cản hoàn toàn mọi quá trình phiên mã."}, {"label": "D", "text": "làm cho mọi tế bào biểu hiện cùng một nhóm gene."}]}, {"id": "BÀI 3. ĐIỀU HÒA BIỂU HIỆN GENE|mcq|27|157", "lesson": "BÀI 3. ĐIỀU HÒA BIỂU HIỆN GENE", "type": "mcq", "number": "27", "prompt": "Câu 27. Trong cơ thể đa bào, các tế bào có cùng hệ gene vẫn biệt hóa và thực hiện chức năng khác nhau chủ yếu vì", "options": [{"label": "A", "text": "mỗi loại tế bào làm mất hẳn các gene không dùng."}, {"label": "B", "text": "mỗi loại tế bào có một mã di truyền riêng."}, {"label": "C", "text": "các tế bào tự thay đổi trình tự nucleotide của toàn bộ hệ gene."}, {"label": "D", "text": "các tế bào đóng, mở những nhóm gene khác nhau."}]}, {"id": "BÀI 3. ĐIỀU HÒA BIỂU HIỆN GENE|mcq|28|158", "lesson": "BÀI 3. ĐIỀU HÒA BIỂU HIỆN GENE", "type": "mcq", "number": "28", "prompt": "Câu 28. Hậu quả nào có thể xảy ra khi điều hòa biểu hiện gene bị rối loạn trong quá trình phát triển cá thể?", "options": [{"label": "A", "text": "Phôi có thể chết, cơ thể dị dạng hoặc tế bào phân chia mất kiểm soát dẫn đến ung thư."}, {"label": "B", "text": "Tất cả tế bào đều lập tức mất toàn bộ DNA."}, {"label": "C", "text": "Mọi gene cấu trúc đều chuyển thành gene điều hòa."}, {"label": "D", "text": "Cơ thể luôn sinh trưởng nhanh hơn và khỏe hơn."}]}, {"id": "BÀI 3. ĐIỀU HÒA BIỂU HIỆN GENE|mcq|29|159", "lesson": "BÀI 3. ĐIỀU HÒA BIỂU HIỆN GENE", "type": "mcq", "number": "29", "prompt": "Câu 29. Trong điều trị bệnh, ứng dụng dùng hiểu biết về biểu hiện gene là", "options": [{"label": "A", "text": "Dùng kháng sinh để làm tăng biểu hiện mọi gene của vi khuẩn."}, {"label": "B", "text": "Làm cho tất cả tế bào cơ thể phân chia liên tục."}, {"label": "C", "text": "Sản xuất thuốc ức chế đặc hiệu sản phẩm của gene gây bệnh."}, {"label": "D", "text": "Thay toàn bộ hệ gene của người bệnh bằng hệ gene của vi khuẩn."}]}, {"id": "BÀI 3. ĐIỀU HÒA BIỂU HIỆN GENE|mcq|30|160", "lesson": "BÀI 3. ĐIỀU HÒA BIỂU HIỆN GENE", "type": "mcq", "number": "30", "prompt": "Câu 30. Nuôi cấy và xử lí tế bào gốc để chúng biệt hóa thành các loại tế bào khác nhau có thể được dùng nhằm", "options": [{"label": "A", "text": "làm tăng số nhiễm sắc thể của mọi tế bào."}, {"label": "B", "text": "hỗ trợ chữa bệnh hoặc thử tác động của thuốc lên các loại tế bào."}, {"label": "C", "text": "ngăn tế bào biểu hiện bất kì gene nào."}, {"label": "D", "text": "biến mọi tế bào thành giao tử."}]}, {"id": "BÀI 3. ĐIỀU HÒA BIỂU HIỆN GENE|mcq|31|161", "lesson": "BÀI 3. ĐIỀU HÒA BIỂU HIỆN GENE", "type": "mcq", "number": "31", "prompt": "Câu 31. Trong trồng trọt, ứng dụng điều hòa biểu hiện gene là", "options": [{"label": "A", "text": "Chỉ tăng lượng phân bón để làm thay đổi trình tự DNA."}, {"label": "B", "text": "Loại bỏ toàn bộ ánh sáng để cây luôn ra hoa."}, {"label": "C", "text": "Làm mất các gene điều hòa của cây trồng."}, {"label": "D", "text": "Dùng chất hoạt hóa gene trong nuôi cấy mô."}]}, {"id": "BÀI 3. ĐIỀU HÒA BIỂU HIỆN GENE|mcq|32|162", "lesson": "BÀI 3. ĐIỀU HÒA BIỂU HIỆN GENE", "type": "mcq", "number": "32", "prompt": "Câu 32. Trong chăn nuôi, ứng dụng điều hòa biểu hiện gene là", "options": [{"label": "A", "text": "Dùng hormone sinh dục đực xử lí trứng cá rô phi đã thụ tinh để tạo tỉ lệ cá đực cao."}, {"label": "B", "text": "Làm bất hoạt mọi gene sinh trưởng của vật nuôi."}, {"label": "C", "text": "Tăng số lượng nhiễm sắc thể ở tất cả con non."}, {"label": "D", "text": "Chỉ thay đổi thành phần thức ăn mà không tác động đến sinh trưởng, phát triển."}]}, {"id": "BÀI 3. ĐIỀU HÒA BIỂU HIỆN GENE|tf|1|163", "lesson": "BÀI 3. ĐIỀU HÒA BIỂU HIỆN GENE", "type": "tf", "number": "1", "prompt": "Khi nói về cơ chế hoạt động của operon Lac, mỗi nhận định sau đây là đúng hay sai?", "statements": [{"label": "a", "text": "Điều hòa biểu hiện gene là điều hòa lượng sản phẩm của gene."}, {"label": "b", "text": "Ở sinh vật nhân sơ, điều hòa biểu hiện gene diễn ra chủ yếu ở giai đoạn phiên mã."}, {"label": "c", "text": "Đường lactose là chất cảm ứng."}, {"label": "d", "text": "Gene điều hoà chỉ phiên mã khi môi trường không có đường lactose."}]}, {"id": "BÀI 3. ĐIỀU HÒA BIỂU HIỆN GENE|tf|2|164", "lesson": "BÀI 3. ĐIỀU HÒA BIỂU HIỆN GENE", "type": "tf", "number": "2", "prompt": "Khi nói về cơ chế hoạt động của operon Lac, mỗi nhận định sau đây là đúng hay sai?", "statements": [{"label": "a", "text": "Gene điều hòa là một thành phần của operon Lac."}, {"label": "b", "text": "Hoạt động phiên mã của các gene cấu trúc phụ thuộc vào hoạt động của gene điều hòa."}, {"label": "c", "text": "Khi có lactose thì lactose sẽ làm bất hoạt protein ức chế."}, {"label": "d", "text": "Nếu gene điều hòa bị mất chức năng thì các gene lacZ, lacY và lacA sẽ mất khả năng phiên mã."}]}, {"id": "BÀI 3. ĐIỀU HÒA BIỂU HIỆN GENE|tf|3|165", "lesson": "BÀI 3. ĐIỀU HÒA BIỂU HIỆN GENE", "type": "tf", "number": "3", "prompt": "Khi nói về cơ chế di truyền, biến dị của các gene lacZ, lacY và lacA trong operon Lac, mỗi nhận định", "statements": [{"label": "a", "text": "Nếu gene lacY phiên mã 10 lần thì gene lacZ cũng phiên mã 10 lần."}, {"label": "b", "text": "Nếu gene lacA nhân đôi 5 lần thì gene lacY cũng nhân đôi 5 lần."}, {"label": "c", "text": "Nếu vùng P của operon bị mất chức năng thì các gene lacZ, lacY và lacA vẫn có thể phiên mã bình thường."}, {"label": "d", "text": "Nếu gene điều hòa ngừng phiên mã thì gene lacZ cũng ngừng phiên mã."}]}, {"id": "BÀI 3. ĐIỀU HÒA BIỂU HIỆN GENE|tf|4|166", "lesson": "BÀI 3. ĐIỀU HÒA BIỂU HIỆN GENE", "type": "tf", "number": "4", "prompt": "Khi không có đường lactose, trường hợp nào operon Lac vẫn thực hiện phiên mã, mỗi nhận định sau đây", "statements": [{"label": "a", "text": "Gene điều hòa của operon Lac bị sai hỏng dẫn tới protein ức chế bị biến đổi không gian và mất chức năng sinh học."}, {"label": "b", "text": "Đột biến làm mất vùng promoter của operon Lac."}, {"label": "c", "text": "Gene cấu trúc lacY bị sai hỏng dẫn tới protein do gene này quy định tổng hợp bị mất chức năng."}, {"label": "d", "text": "Vùng operator của operon Lac bị sai hỏng và không còn khả năng gắn kết với protein ức chế."}]}, {"id": "BÀI 3. ĐIỀU HÒA BIỂU HIỆN GENE|tf|5|167", "lesson": "BÀI 3. ĐIỀU HÒA BIỂU HIỆN GENE", "type": "tf", "number": "5", "prompt": "Các nhận định sau đây về operon Lac là đúng hay sai?", "statements": [{"label": "a", "text": "Điều hòa hoạt động của gene chính là điều hoà lượng sản phẩm của gene được tạo ra."}, {"label": "b", "text": "Đối với operon Lac ở E. coli thì tín hiệu giúp gene cấu trúc hoạt động là đường lactose."}, {"label": "c", "text": "Gene điều hòa (lacI) là vị trí tiếp xúc với enzyme RNA polymerase để xúc tác quá trình phiên mã của các gene cấu trúc."}, {"label": "d", "text": "Số lần phiên mã của gene lacI bằng số lần phiên mã của ba gene cấu trúc trong bất kì môi trường nào."}]}, {"id": "BÀI 3. ĐIỀU HÒA BIỂU HIỆN GENE|tf|6|168", "lesson": "BÀI 3. ĐIỀU HÒA BIỂU HIỆN GENE", "type": "tf", "number": "6", "prompt": "Operon Lac ở E. coli, khi môi trường không có lactose nhưng enzyme chuyển hóa lactose vẫn được", "statements": [{"label": "a", "text": "Do vùng điều hòa (P) bị bất hoạt nên enzyme RNA polymerase có thể bám vào để khởi động quá trình phiên mã."}, {"label": "b", "text": "Do gene điều hòa (lacI) bị đột biến nên không tạo được protein ức chế."}, {"label": "c", "text": "Do vùng vận hành (O) bị đột biến nên không liên kết được với protein ức chế."}, {"label": "d", "text": "Do các gene cấu trúc lacZ, lacY, lacA bị đột biến làm tăng khả năng biểu hiện của các phân tử protein do gene mã hóa."}]}, {"id": "BÀI 3. ĐIỀU HÒA BIỂU HIỆN GENE|tf|7|169", "lesson": "BÀI 3. ĐIỀU HÒA BIỂU HIỆN GENE", "type": "tf", "number": "7", "prompt": "Các phát biểu sau nói về mô hình hoạt động của operon Lac ở vi khuẩn E. coli. Mỗi phát biểu sau đây", "statements": [{"label": "a", "text": "Gene điều hòa tổng hợp ra protein ức chế mà không phụ thuộc vào sự có mặt của chất cảm ứng lactose."}, {"label": "b", "text": "Vùng vận hành là vị trí tương tác với protein ức chế để ngăn cản hoạt động của enzyme DNA polymerase."}, {"label": "c", "text": "Ba gene cấu trúc lacZ, lacY, lacA trong operon Lac thường được phiên mã đồng thời tạo ra một phân tử mRNA mang thông tin mã hóa cho cả ba gene."}, {"label": "d", "text": "Lượng sản phẩm của các gene cấu trúc có thể được tăng lên nếu có đột biến xảy ra tại vùng vận hành."}]}, {"id": "BÀI 3. ĐIỀU HÒA BIỂU HIỆN GENE|tf|8|170", "lesson": "BÀI 3. ĐIỀU HÒA BIỂU HIỆN GENE", "type": "tf", "number": "8", "prompt": "Ở vi khuẩn E. coli, xét một đoạn phân tử DNA có năm gene A, B, D, E, G. Trong đó có bốn gene A,", "statements": [{"label": "a", "text": "Nếu gene A nhân đôi ba lần thì gene D cũng nhân đôi ba lần."}, {"label": "b", "text": "Nếu gene B tạo ra được 20 phân tử mRNA thì gene E cũng tạo ra được 20 phân tử mRNA."}, {"label": "c", "text": "Nếu gene G tổng hợp ra 15 phân tử RNA thì gene D cũng tổng hợp ra 15 phân tử RNA."}, {"label": "d", "text": "Nếu xảy ra đột biến mất một cặp nucleotide ở gene A thì có thể sẽ làm thay đổi cấu trúc của mRNA ở tất cả các gene."}]}, {"id": "BÀI 3. ĐIỀU HÒA BIỂU HIỆN GENE|tf|9|171", "lesson": "BÀI 3. ĐIỀU HÒA BIỂU HIỆN GENE", "type": "tf", "number": "9", "prompt": "Hình dưới đây mô tả trạng thái hoạt động của operon Lac ở vi khuẩn E.coli.", "statements": [{"label": "a", "text": "Trạng thái A là trạng thái hoạt động của operon khi môi trường không có lactose."}, {"label": "b", "text": "Gene điều hòa lacI được phiên mã khi ở trạng thái A và không phiên mã khi ở trạng thái B."}, {"label": "c", "text": "Allolactose đóng vai trò là chất cảm ứng."}, {"label": "d", "text": "Ở cả hai trạng thái, enzyme RNA polymerase đều bám được vào vùng P của operon."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|mcq|1|172", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "mcq", "number": "1", "prompt": "Câu 1. Đột biến gene là những biến đổi", "options": [{"label": "A", "text": "vật chất di truyền ở cấp độ phân tử hoặc cấp độ tế bào."}, {"label": "B", "text": "trong cấu trúc của gene, liên quan đến một hoặc một số nucleotide tại một điểm nào đó trên DNA."}, {"label": "C", "text": "trong cấu trúc của gene, liên quan đến một hoặc một số cặp nucleotide tại một điểm nào đó trên DNA."}, {"label": "D", "text": "trong cấu trúc của nhiễm sắc thể, xảy ra trong quá trình phân chia tế bào."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|mcq|2|173", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "mcq", "number": "2", "prompt": "Câu 2. Đột biến điểm là đột biến", "options": [{"label": "A", "text": "làm thay đổi toàn bộ hệ gene của sinh vật."}, {"label": "B", "text": "chỉ xảy ra ở một điểm trên nhiễm sắc thể và luôn làm mất gene."}, {"label": "C", "text": "làm thay đổi nhiều nhiễm sắc thể cùng lúc."}, {"label": "D", "text": "làm thay đổi một cặp nucleotide trong gene."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|mcq|3|174", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "mcq", "number": "3", "prompt": "Câu 3. Quá trình …(1)… thường dễ làm phát sinh đột biến gene. Cụm từ cần điền vào vị trí (1) là", "options": [{"label": "A", "text": "phiên mã và dịch mã."}, {"label": "B", "text": "dịch mã."}, {"label": "C", "text": "phiên mã."}, {"label": "D", "text": "tái bản DNA."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|mcq|4|175", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "mcq", "number": "4", "prompt": "Câu 4. Các dạng đột biến gene làm xê dịch khung đọc mã di truyền bao gồm những dạng nào sau đây?", "options": [{"label": "A", "text": "Thay thế và mất một cặp nucleotide."}, {"label": "B", "text": "Thay thế và thêm một cặp nucleotide."}, {"label": "C", "text": "Mất hoặc thêm một cặp nucleotide."}, {"label": "D", "text": "Thay thế một cặp nucleotide."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|mcq|5|176", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "mcq", "number": "5", "prompt": "Câu 5. Gene A bị đột biến thành gene a, hai gene này có chiều dài bằng nhau nhưng gene a hơn gene A một liên kết hydrogen, chứng tỏ gene A đã xảy ra đột biến dạng", "options": [{"label": "A", "text": "thêm 1 cặp G-"}, {"label": "C", "text": ""}, {"label": "B", "text": "thay thế cặp A-T bằng cặp G-"}, {"label": "C", "text": ""}, {"label": "C", "text": "thay thế cặp G-C bằng cặp A-T."}, {"label": "D", "text": "mất 1 cặp A-T."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|mcq|6|177", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "mcq", "number": "6", "prompt": "Câu 6. Đột biến điểm gồm các dạng", "options": [{"label": "A", "text": "mất, thêm một cặp nucleotide."}, {"label": "B", "text": "mất, thêm hoặc thay thế một cặp nucleotide."}, {"label": "C", "text": "mất, thêm, thay thế hoặc đảo một cặp nucleotide."}, {"label": "D", "text": "mất, thêm hoặc thay thế một vài cặp nucleotide."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|mcq|7|178", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "mcq", "number": "7", "prompt": "Câu 7. Thể đột biến là", "options": [{"label": "A", "text": "những cơ thể mang gene đột biến đã biểu hiện thành kiểu hình."}, {"label": "B", "text": "những cơ thể mang đột biến gene hoặc đột biến NST."}, {"label": "C", "text": "những cơ thể mang đột biến gene trội hoặc đột biến gene lặn."}, {"label": "D", "text": "những cơ thể mang đột biến nhưng chưa được biểu hiện ra kiểu hình."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|mcq|8|179", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "mcq", "number": "8", "prompt": "Câu 8. Nguyên nhân phát sinh đột biến gene gồm", "options": [{"label": "A", "text": "chỉ có tác nhân vật lí từ môi trường."}, {"label": "B", "text": "chỉ có sai sót trong phiên mã và dịch mã."}, {"label": "C", "text": "sai sót tự phát khi tái bản DNA hoặc tác động của tác nhân vật lí, hóa học và sinh học."}, {"label": "D", "text": "mọi biến đổi nhiệt độ đều chắc chắn gây đột biến gene."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|mcq|9|180", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "mcq", "number": "9", "prompt": "Câu 9. Trong tái bản DNA, cơ chế nào có thể dẫn đến đột biến thêm hoặc mất một cặp nucleotide?", "options": [{"label": "A", "text": "Mọi nucleotide đều được dùng làm khuôn đúng một lần."}, {"label": "B", "text": "Một nucleotide được dùng làm khuôn hai lần hoặc không được dùng làm khuôn."}, {"label": "C", "text": "Ribosome đọc lặp lại một codon trên mRNA."}, {"label": "D", "text": "Một amino acid không được gắn vào chuỗi polypeptide."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|mcq|10|181", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "mcq", "number": "10", "prompt": "Câu 10. Chất 5-bromouracil (5-BrU) có thể gây đột biến thay thế cặp A-T bằng G-C vì", "options": [{"label": "A", "text": "gây đứt gãy đồng thời cả hai mạch polynucleotide dẫn đến mất hoàn toàn cấu trúc gene."}, {"label": "B", "text": "ức chế sự tháo xoắn và ngăn cản hoàn toàn quá trình tổng hợp mạch mới DNA."}, {"label": "C", "text": "tạo ra liên kết cộng hóa trị giữa hai base thymine liền kề trên cùng một mạch."}, {"label": "D", "text": "có cấu trúc giống base bình thường nhưng thay đổi cách bắt cặp qua các lần tái bản."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|mcq|11|182", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "mcq", "number": "11", "prompt": "Câu 11. Tia UV có thể gây đột biến gene theo cơ chế nào?", "options": [{"label": "A", "text": "Tác động trực tiếp vào các base nitrogen, làm toàn bộ các cặp A-T trong phân tử DNA đồng loạt biến đổi và chuyển thành cặp G-"}, {"label": "C", "text": ""}, {"label": "B", "text": "Bỏ qua giai đoạn phiên mã và dịch mã, chỉ tác động trực tiếp làm thay đổi cấu trúc không gian của protein đã được tổng hợp."}, {"label": "C", "text": "Làm hai thymine liền kề trên một mạch liên kết với nhau, quá trình sửa chữa có thể dẫn đến đột biến thêm hoặc mất cặp nucleotide."}, {"label": "D", "text": "Không làm thay đổi trình tự nucleotide của DNA mà chỉ tác động làm tăng số lượng nhiễm sắc thể trong quá trình tế bào đang phân chia."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|mcq|12|183", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "mcq", "number": "12", "prompt": "Câu 12. Trong số các dạng đột biến sau đây dạng nào thường gây hậu quả ít nghiêm trọng nhất?", "options": [{"label": "A", "text": "đột biến mất đoạn NST."}, {"label": "B", "text": "mất 1 cặp nucleotide."}, {"label": "C", "text": "thay thế một cặp nucleotide."}, {"label": "D", "text": "thêm một cặp nucleotide."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|mcq|13|184", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "mcq", "number": "13", "prompt": "Câu 13. Loại đột biến nào sau đây làm cho gene cấu trúc bị mất tám liên kết hydrogen và chuỗi polypeptide tổng hợp theo gene đột biến bị giảm một amino acid?", "options": [{"label": "A", "text": "Mất bốn cặp G - C và thêm hai cặp A - T."}, {"label": "B", "text": "Mất một cặp A - T và hai cặp G -"}, {"label": "C", "text": ""}, {"label": "C", "text": "Mất bốn cặp A - T."}, {"label": "D", "text": "Thay thế tám cặp G - C bằng tám cặp A - T."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|mcq|14|185", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "mcq", "number": "14", "prompt": "Câu 14. Cho biết trình tự nucleotide của gene bình thường và gene đột biến như sau: Gene bình thường Gene đột biến …ATA TCG AAA… …TAT AGC TTT… …ATA CCG AAA… …TAT GGC TTT… Đột biến trên thuộc dạng gì?", "options": [{"label": "A", "text": "Mất 2 cặp nucleotide."}, {"label": "B", "text": "Thay thế 1 cặp nucleotide."}, {"label": "C", "text": "Thêm 1 cặp nucleotide."}, {"label": "D", "text": "Mất 1 cặp nucleotide."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|mcq|15|186", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "mcq", "number": "15", "prompt": "Câu 15. Đột biến thay thế 1 cặp A – T bằng 1 cặp G – C sẽ làm số liên kết hydrogen của gene thay đổi như thế nào?", "options": [{"label": "A", "text": "Giảm 2."}, {"label": "B", "text": "Tăng 1"}, {"label": "C", "text": "Tăng 2."}, {"label": "D", "text": "Giảm 1."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|mcq|16|187", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "mcq", "number": "16", "prompt": "Câu 16. Đột biến mất 1 cặp A - T sẽ làm số liên kết hydrogen của gene thay đổi như thế nào?", "options": [{"label": "A", "text": "Giảm 2."}, {"label": "B", "text": "Tăng 1."}, {"label": "C", "text": "Tăng 2."}, {"label": "D", "text": "Giảm 1."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|mcq|17|188", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "mcq", "number": "17", "prompt": "Câu 17. Dạng đột biến nào sau đây là đột biến điểm?", "options": [{"label": "A", "text": "Đảo đoạn NST."}, {"label": "B", "text": "Mất 2 cặp nucleotide."}, {"label": "C", "text": "Thêm 1 cặp nucleotide."}, {"label": "D", "text": "Lặp đoạn NST."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|mcq|18|189", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "mcq", "number": "18", "prompt": "Câu 18. Đột biến mất 1 cặp G - C sẽ làm số liên kết hydrogen của gene thay đổi như thế nào?", "options": [{"label": "A", "text": "Giảm 2."}, {"label": "B", "text": "Giảm 3."}, {"label": "C", "text": "Tăng 3."}, {"label": "D", "text": "Tăng 2."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|mcq|19|190", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "mcq", "number": "19", "prompt": "Câu 19. Một đột biến điểm làm biến đổi bộ ba 3'TGT5' trên một mạch của allele ban đầu thành bộ ba 3'TAT5' của allele đột biến. Theo lý thuyết, số liên kết hydrogen của allele đột biến thay đổi như thế nào so với allele ban đầu?", "options": [{"label": "A", "text": "Giảm 2 liên kết."}, {"label": "B", "text": "Tăng 1 liên kết."}, {"label": "C", "text": "Giảm 1 liên kết."}, {"label": "D", "text": "Không đổi."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|mcq|20|191", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "mcq", "number": "20", "prompt": "Câu 20. Hiện tượng đột biến ở vi khuẩn S. aureus hoặc S. pneumoniae hình thành các chủng mới dẫn đến chúng có khả năng kháng thuốc kháng sinh đây là ý nghĩa của đột biến gene đối với?", "options": [{"label": "A", "text": "Tiến hóa."}, {"label": "B", "text": "Chọn giống."}, {"label": "C", "text": "Tạo giống."}, {"label": "D", "text": "Nghiên cứu di truy  có hại hoặc trung tính."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|mcq|25|196", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "mcq", "number": "25", "prompt": "Câu 25. Khi nói về đột biến gene, phát biểu nào sau đây là không đúng?", "options": [{"label": "A", "text": "Mức độ gây hại của allele đột biến phụ thuộc vào môi trường và tổ hợp gene."}, {"label": "B", "text": "Gene đột biến khi phát sinh chắc chắn được biểu hiện ngay ra kiểu hình."}, {"label": "C", "text": "Đột biến gene có thể gây hại nhưng cũng có thể vô hại hoặc có lợi đối với thể đột biến."}, {"label": "D", "text": "Đột biến gene làm thay đổi chức năng của protein thường có hại cho thể đột biến."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|mcq|26|197", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "mcq", "number": "26", "prompt": "Câu 26. Vai trò quan trọng của thể đột biến trong nghiên cứu di truyền là", "options": [{"label": "A", "text": "thay thế hoàn toàn phương pháp lai truyền thống và việc quan sát kiểu hình ở thế hệ con."}, {"label": "B", "text": "ức chế sự phân ly tính trạng, làm cho mọi gene trong hệ gene đều biểu hiện giống nhau."}, {"label": "C", "text": "giúp khám phá chức năng gene, xác định tính trạng trội/lặn và tìm hiểu các quy luật di truyền."}, {"label": "D", "text": "duy trì sự ổn định của hệ gene bằng cách ngăn không cho các allele đột biến mới xuất hiện."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|mcq|27|198", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "mcq", "number": "27", "prompt": "Câu 27. Ví dụ nào minh họa vai trò của đột biến gene trong chọn giống cây trồng?", "options": [{"label": "A", "text": "Tất cả cây trồng đều được tạo ra mà không cần chọn lọc."}, {"label": "B", "text": "Chọn lọc đột biến làm chồi cây cải phân nhánh mạnh để tạo các giống súp lơ."}, {"label": "C", "text": "Loại bỏ mọi biến dị ở quần thể cây trồng."}, {"label": "D", "text": "Chỉ thay đổi chế độ tưới nước để tạo allele mới."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|mcq|28|199", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "mcq", "number": "28", "prompt": "Câu 28. Trường hợp nào là ví dụ về chọn giống vật nuôi dựa trên đột biến gene?", "options": [{"label": "A", "text": "Tạo giống lợn mới bằng cách thay đổi liên tục điều kiện môi trường như tăng nhiệt độ khu vực chuồng nuôi."}, {"label": "B", "text": "Chủ động ức chế sự sinh trưởng nhằm làm giảm khối lượng cơ bắp ở tất cả các giống vật nuôi."}, {"label": "C", "text": "Áp dụng biện pháp cách ly nhằm ngăn không cho các cá thể mang biến dị tham gia vào quá trình sinh sản."}, {"label": "D", "text": "Chọn lọc đột biến ở gene điều hòa làm tăng lượng cơ bắp để tạo ra các giống lợn nhiều thịt nạc."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|mcq|29|200", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "mcq", "number": "29", "prompt": "Câu 29. Vì sao đột biến gene được xem là nguồn nguyên liệu của quá trình tiến hóa?", "options": [{"label": "A", "text": "Đột biến liên tục tạo allele mới; chọn lọc tự nhiên tác động lên biến dị đó làm sinh giới đa dạng và có thể góp phần hình thành loài mới."}, {"label": "B", "text": "Đột biến gene mang tính hướng đích, luôn tạo ra các đặc điểm có lợi cho sinh vật và chắc chắn sẽ được chọn lọc tự nhiên giữ lại."}, {"label": "C", "text": "Đột biến gene triệt tiêu các biến dị, làm cho tất cả các cá thể trong cùng một quần thể sinh vật biến đổi để trở nên hoàn toàn giống nhau."}, {"label": "D", "text": "Đột biến gene không phát sinh trong tự nhiên mà chỉ xuất hiện khi con người chủ động sử dụng các tác nhân đột biến để tác động vào sinh vật."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|mcq|35|201", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "mcq", "number": "35", "prompt": "Câu 35. Đột biến làm thay đổi chiều xoắn vỏ ốc, khiến ốc đột biến không giao phối được với ốc bình thường, minh họa cho", "options": [{"label": "A", "text": "vai trò của đột biến gene đối với quá trình dịch mã tổng hợp phân tử protein."}, {"label": "B", "text": "tác dụng làm giảm kích thước và số lượng nucleotide của mọi gene trong hệ gene."}, {"label": "C", "text": "khả năng đột biến tạo cách li sinh sản và góp phần hình thành loài mới."}, {"label": "D", "text": "việc mọi đột biến phát sinh đều có hại và luôn bị loại bỏ khỏi quần thể."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|tf|1|202", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "tf", "number": "1", "prompt": "Khi nói về đột biến gene, mỗi nhận định sau đây là đúng hay sai?", "statements": [{"label": "a", "text": "Có thể có lợi, có hại hoặc trung tính."}, {"label": "b", "text": "Làm biến đổi cấu trúc của gene liên quan tới một cặp hoặc một số cặp nucleotide."}, {"label": "c", "text": "Làm nguyên liệu của quá trình chọn giống và tiến hóa."}, {"label": "d", "text": "Có thể làm cho sinh vật ngày càng đa dạng, phong phú."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|tf|2|203", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "tf", "number": "2", "prompt": "Khi nói về đặc điểm của đột biến thay thế một cặp nucleotide, mỗi nhận định sau đây là đúng hay sai?", "statements": [{"label": "a", "text": "Là một dạng đột biến điểm."}, {"label": "b", "text": "Chỉ liên quan tới một bộ ba."}, {"label": "c", "text": "Làm thay đổi trình tự nucleotide của nhiều bộ ba."}, {"label": "d", "text": "Dễ xảy ra hơn so với các dạng đột biến gene khác."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|tf|3|204", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "tf", "number": "3", "prompt": "Allele A ở vi khuẩn E. coli bị đột biến điểm thành allele a. Theo lí thuyết mỗi nhận định sau đây là đúng", "statements": [{"label": "a", "text": "Nếu đột biến thay thế 1 cặp nucleotide ở vị trí giữa gene thì có thể làm thay đổi toàn bộ các bộ ba từ vị trí xảy ra đột biến cho đến cuối gene."}, {"label": "b", "text": "Chuỗi polypeptide do allele a và chuỗi polypeptide do allele A quy định có thể có trình tự amino acid giống nhau."}, {"label": "c", "text": "Nếu đột biến mất 1 cặp nucleotide thì allele a và allele A có chiều dài bằng nhau."}, {"label": "d", "text": "Allele a và allele A có số lượng nucleotide bằng nhau."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|tf|4|205", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "tf", "number": "4", "prompt": "Các codon 5′GUU3′, 5′GUC3′, 5′GUA3′, 5′GUG3′ mã hóa cho amino acid valine; 5′GGU3′, 5′GGC3′,", "statements": [{"label": "a", "text": "Đột biến thay thế cặp nucleotide T – A thành G – C trong triplet của gene làm thay đổi amino acid valine bằng amino acid glycine."}, {"label": "b", "text": "Có bốn đột biến thay thế 1 cặp nucleotide khác nhau trong triplet của gene làm thay đổi amino acid valine bằng amino acid glycine."}, {"label": "c", "text": "Đột biến mất một cặp nucleotide trong triplet của gene có thể làm thay đổi amino acid valine bằng amino acid glycine."}, {"label": "d", "text": "Nếu hai chuỗi polypeptide do 2 allele khác nhau quy định chỉ khác nhau ở amino acid valine và glycine thì có thể đã xảy ra đột biến thay thế."}]}, {"id": "BÀI 4: ĐỘT BIẾN GENE|tf|5|206", "lesson": "BÀI 4: ĐỘT BIẾN GENE", "type": "tf", "number": "5", "prompt": "Mức độ gây hại của allele đột biến thường phụ thuộc vào các yếu tố, theo lí thuyết thì phát biểu nào", "statements": [{"label": "a", "text": "Tác nhân đột biến."}, {"label": "b", "text": "Điều kiện môi trường."}, {"label": "c", "text": "Mức độ bền vững của gene."}, {"label": "d", "text": "Tổ hợp mang gene đột biến."}]}, {"id": "BÀI 5. CÔNG NGHỆ GENE|mcq|1|207", "lesson": "BÀI 5. CÔNG NGHỆ GENE", "type": "mcq", "number": "1", "prompt": "Câu 1. Công nghệ gene là", "options": [{"label": "A", "text": "quy trình tạo những tế bào có gene bị biến đổi."}, {"label": "B", "text": "quy trình tạo những tế bào hoặc sinh vật có gene bị biến đổi."}, {"label": "C", "text": "quy trình tạo những tế bào có gen bị biến đổi hoặc có thêm gene mới."}, {"label": "D", "text": "quy trình kĩ thuật liên quan đến nghiên cứu sự biểu hiện gene, chỉnh sửa gene và chuyển gene từ đó tạo ra các tế bào, cơ thể sinh vật có hệ gene biểu hiện những tính trạng mong muốn."}]}, {"id": "BÀI 5. CÔNG NGHỆ GENE|mcq|2|208", "lesson": "BÀI 5. CÔNG NGHỆ GENE", "type": "mcq", "number": "2", "prompt": "Câu 2. Công nghệ gene đang được sử dụng phổ biến hiện nay là", "options": [{"label": "A", "text": "kĩ thuật tạo tế bào lai."}, {"label": "B", "text": "công nghệ DNA tái tổ hợp."}, {"label": "C", "text": "kĩ thuật cắt gene."}, {"label": "D", "text": "kĩ thuật nối gene."}]}, {"id": "BÀI 5. CÔNG NGHỆ GENE|mcq|3|209", "lesson": "BÀI 5. CÔNG NGHỆ GENE", "type": "mcq", "number": "3", "prompt": "Câu 3. Công nghệ DNA tái tổ hợp là", "options": [{"label": "A", "text": "gồm công nghệ DNA tái tổ hợp và công nghệ tạo sinh vật biến đổi gene."}, {"label": "B", "text": "quy trình kĩ thuật sử dụng công nghệ DNA tái tổ hợp để thay đổi kiểu gene và kiểu hình của sinh vật."}, {"label": "C", "text": "quy trình kĩ thuật dựa trên nguyên lí tái tổ hợp DNA và biểu hiện gene, tạo ra sản phẩm là DNA tái tổ hợp và protein tái tổ hợp với số lượng lớn phục vụ cho đời sống con người."}, {"label": "D", "text": "tạo ra đoạn DNA có khả năng làm vector có khả năng tái bản cũng như đảm bảo cho gene biểu hiện."}]}, {"id": "BÀI 5. CÔNG NGHỆ GENE|mcq|4|210", "lesson": "BÀI 5. CÔNG NGHỆ GENE", "type": "mcq", "number": "4", "prompt": "Câu 4. Các sinh vật chứa gene ngoại lai trong hệ gene gọi là sinh vật?", "options": [{"label": "A", "text": "tách dòng gene."}, {"label": "B", "text": "biến dị gene."}, {"label": "C", "text": "biến đổi gene."}, {"label": "D", "text": "đột biến gene."}]}, {"id": "BÀI 5. CÔNG NGHỆ GENE|mcq|5|211", "lesson": "BÀI 5. CÔNG NGHỆ GENE", "type": "mcq", "number": "5", "prompt": "Câu 5. Trong kĩ thuật tạo DNA tái tổ hợp, loại enzyme nào sau đây đã được sử dụng để xử lí thể truyền và gene cần chuyển để tạo cùng một loại “đầu dính”?", "options": [{"label": "A", "text": "Lipase."}, {"label": "B", "text": "Amilase."}, {"label": "C", "text": "Catalase."}, {"label": "D", "text": "Restrictase."}]}, {"id": "BÀI 5. CÔNG NGHỆ GENE|mcq|6|212", "lesson": "BÀI 5. CÔNG NGHỆ GENE", "type": "mcq", "number": "6", "prompt": "Câu 6. Hình bên mô tả bước tạo DNA tái tổ hợp trong công nghệ gene, plasmid là chú thích số bao nhiêu?", "options": [{"label": "A", "text": "số 1."}, {"label": "B", "text": "số 2."}, {"label": "C", "text": "số 3."}, {"label": "D", "text": "số 4."}]}, {"id": "BÀI 5. CÔNG NGHỆ GENE|mcq|7|213", "lesson": "BÀI 5. CÔNG NGHỆ GENE", "type": "mcq", "number": "7", "prompt": "Câu 7. Vector biểu hiện gene là vector được bổ sung vùng …(1)… nhằm biểu hiện gene tạo..(2)…. trong quy trình tạo DNA tái tổ hợp. Cụm từ (1)/(2) còn thiếu là?", "options": [{"label": "A", "text": "1-promote;2- RNA tái tổ hợp."}, {"label": "B", "text": "1- promoter;2- DNA tái tổ hợp."}, {"label": "C", "text": "1- operater; 2- protein tái tổ hợp."}, {"label": "D", "text": "1- promoter;2- protein tái tổ hợp."}]}, {"id": "BÀI 5. CÔNG NGHỆ GENE|mcq|8|214", "lesson": "BÀI 5. CÔNG NGHỆ GENE", "type": "mcq", "number": "8", "prompt": "Câu 8. Hình dưới mô tả một giai đoạn nào sau đây của quy trình công nghệ gene để tạo giống sinh vật biến đổi gene?", "options": [{"label": "A", "text": "Tạo plasmid."}, {"label": "B", "text": "Tạo thể truyền."}, {"label": "C", "text": "Tạo DNA tái tổ hợp."}, {"label": "D", "text": "Tạo ra sinh vật mang gene biến đổi."}]}, {"id": "BÀI 5. CÔNG NGHỆ GENE|mcq|9|215", "lesson": "BÀI 5. CÔNG NGHỆ GENE", "type": "mcq", "number": "9", "prompt": "Câu 9. Hình bên mô tả bước tạo DNA tái tổ hợp trong công nghệ gene, đoạn gene cần chuyển là chú thích số bao nhiêu?", "options": [{"label": "A", "text": "số 1."}, {"label": "B", "text": "số 2."}, {"label": "C", "text": "số 3."}, {"label": "D", "text": "số 4."}]}, {"id": "BÀI 5. CÔNG NGHỆ GENE|mcq|10|216", "lesson": "BÀI 5. CÔNG NGHỆ GENE", "type": "mcq", "number": "10", "prompt": "Câu 10. Enzyme cắt (Restrictase) được dùng trong kĩ thuật di truyền vì", "options": [{"label": "A", "text": "phân loại được các gene cần chuyển."}, {"label": "B", "text": "nối gene cần chuyển vào thể truyền để tạo DNA tái tổ hợp."}, {"label": "C", "text": "có khả năng nhận biết và cắt đứt DNA ở những điểm xác định."}, {"label": "D", "text": "đánh dấu được thể truyền để dễ nhận biết trong quá trình chuyển gen."}]}, {"id": "BÀI 5. CÔNG NGHỆ GENE|mcq|11|217", "lesson": "BÀI 5. CÔNG NGHỆ GENE", "type": "mcq", "number": "11", "prompt": "Câu 11. Thể truyền thường được sử dụng trong kỹ thuật cấy gene là", "options": [{"label": "A", "text": "động vật nguyên sinh."}, {"label": "B", "text": "vi khuẩn E.Coli."}, {"label": "C", "text": "plasmid hoặc thể thực khuẩn."}, {"label": "D", "text": "nấm đơn bào."}]}, {"id": "BÀI 5. CÔNG NGHỆ GENE|mcq|12|218", "lesson": "BÀI 5. CÔNG NGHỆ GENE", "type": "mcq", "number": "12", "prompt": "Câu 12. Trong kĩ thuật chuyển gene, loại enzyme nào sau đây tham gia vào quá trình tạo DNA tái tổ hợp?", "options": [{"label": "A", "text": "Restrictase."}, {"label": "B", "text": "Cellulase."}, {"label": "C", "text": "Nitrogenase."}, {"label": "D", "text": "Pepsin."}]}, {"id": "BÀI 5. CÔNG NGHỆ GENE|mcq|13|219", "lesson": "BÀI 5. CÔNG NGHỆ GENE", "type": "mcq", "number": "13", "prompt": "Câu 13. Chuột nhắt mang hormone sinh trưởng của chuột cống là thành tựu của", "options": [{"label": "A", "text": "Nhân bản vô tính"}, {"label": "B", "text": "cấy truyền phôi"}, {"label": "C", "text": "Công nghệ gene"}, {"label": "D", "text": "gây đột biến"}]}, {"id": "BÀI 5. CÔNG NGHỆ GENE|mcq|14|220", "lesson": "BÀI 5. CÔNG NGHỆ GENE", "type": "mcq", "number": "14", "prompt": "Câu 14. Trong kĩ thuật chuyển gene, enzyme dùng để nối gene cần chuyển và thể truyền là", "options": [{"label": "A", "text": "restrictase."}, {"label": "B", "text": "DNA polymerase."}, {"label": "C", "text": "RNA polymerase."}, {"label": "D", "text": "ligase."}]}, {"id": "BÀI 5. CÔNG NGHỆ GENE|mcq|15|221", "lesson": "BÀI 5. CÔNG NGHỆ GENE", "type": "mcq", "number": "15", "prompt": "Câu 15. Restrictase và ligase tham gia vào công đoạn nào sau đây của quy trình chuyểngen?", "options": [{"label": "A", "text": "Tách DNA của NST tế bào cho và tách plasmid ra khỏi tế bào vi khuẩn."}, {"label": "B", "text": "Cắt, nối DNA của tế bào cho và plasmid ở những điểm xác định tạo nên DNA tái tổ hợp."}, {"label": "C", "text": "Chuyển DNA tái tổ hợp vào tế bào nhận."}, {"label": "D", "text": "Tạo điều kiện cho gene được phép biểu hiện."}]}, {"id": "BÀI 5. CÔNG NGHỆ GENE|mcq|16|222", "lesson": "BÀI 5. CÔNG NGHỆ GENE", "type": "mcq", "number": "16", "prompt": "Câu 16. Để tạo ra động vật chuyển gene, các nhà khoa học phải sử dụng", "options": [{"label": "A", "text": "trứng vừa được thụ tinh dùng làm tế bào nhận gene chuyển."}, {"label": "B", "text": "trứng chưa được thụ tinh dùng làm tế bào nhận gene chuyển."}, {"label": "C", "text": "trứng đã được biến đổi gene dùng làm tế bào nhận gene chuyển."}, {"label": "D", "text": "trứng đã được thụ tinh một thời gian làm tế bào nhận gene chuyển."}]}, {"id": "BÀI 5. CÔNG NGHỆ GENE|mcq|17|223", "lesson": "BÀI 5. CÔNG NGHỆ GENE", "type": "mcq", "number": "17", "prompt": "Câu 17. Vì tế bào thực vật có thành tế bào nên việc chuyển DNA tái tổ hợp các nhà khoa học thường sử dụng", "options": [{"label": "A", "text": "vi khuẩn mang gene cần chuyển thâm nhập qua thành tế bào."}, {"label": "B", "text": "vi khuẩn mang vector tái tổ hợp xâm nhập qua thành tế bào."}, {"label": "C", "text": "súng bắn gene bắn các hạt chứa DNA tái tổ hợp bọc bằng vàng hay vofarm vào tế bào hoặc dùng virus."}, {"label": "D", "text": "súng bắn gene bắn các hạt chứa gene tế bào cho bọc bằng vàng hay vofarm vào tế bào hoặc dùng virus."}]}, {"id": "BÀI 5. CÔNG NGHỆ GENE|mcq|18|224", "lesson": "BÀI 5. CÔNG NGHỆ GENE", "type": "mcq", "number": "18", "prompt": "Câu 18. Quy trình công nghệ DNA tái tổ hợp gồm các bước I. Sản xuất protein tái tổ hợp. II. Tách dòng và tạo DNA tái tổ hợp. III. Biểu hiện gene và phân tích biểu hiện gene. Thứ tự đúng là", "options": [{"label": "A", "text": "II-III-I."}, {"label": "B", "text": "I-II-III."}, {"label": "C", "text": "II-I-III."}, {"label": "D", "text": "III-II-I."}]}, {"id": "BÀI 5. CÔNG NGHỆ GENE|mcq|19|225", "lesson": "BÀI 5. CÔNG NGHỆ GENE", "type": "mcq", "number": "19", "prompt": "Câu 19. Để xác định sự có mặt của gene chuyển, người ta tiến hành phân tích sinh vật chuyển gene bằng kĩ thuật", "options": [{"label": "A", "text": "lai phân tử."}, {"label": "B", "text": "PCR."}, {"label": "C", "text": "Lai xa và đa bội hóa."}, {"label": "D", "text": "PCR hoặc lai phân tử."}]}, {"id": "BÀI 5. CÔNG NGHỆ GENE|mcq|20|226", "lesson": "BÀI 5. CÔNG NGHỆ GENE", "type": "mcq", "number": "20", "prompt": "Câu 20. Cho các thành tựu sau, đâu không phải là thành tựu của tạo động vật chuyển gene?", "options": [{"label": "A", "text": "Dê chuyển gen sản xuất sữa chứa protein CFTR chữa bệnh u xơ nang."}, {"label": "B", "text": "Cừu mang gene tổng hợp được huyết thanh và α -1- antitrypsin ( một loại protein có chức năng bảo vệ phổi khỏi sự tác động của enzyme) ở người chữa bệnh khí thủng phổi(emphysema)."}, {"label": "C", "text": "Cừu Dolly được tạo ra từ nhân tế bào trứng kết hợp với tế bào chất tế bào vú không qua thụ tinh."}, {"label": "D", "text": "Bò có mang gene có chứa hàm lượng β -lactoglobulin cao."}]}, {"id": "BÀI 5. CÔNG NGHỆ GENE|mcq|21|227", "lesson": "BÀI 5. CÔNG NGHỆ GENE", "type": "mcq", "number": "21", "prompt": "Câu 21. Cho một số thao tác cơ bản trong quy trình chuyển gene tạo ra chủng vi khuẩn có khả năng tổng hợp insulin của người như sau: (1) Tách plasmid từ tế bào vi khuẩn và tách gene mã hóa insulin từ tế bào người. (2) Phân lập dòng tế bào chứa DNA tái tổ hợp mang gene mã hóa insulin của người. (3) Chuyển DNA tái tổ hợp mang gene mã hóa insulin của người vào tế bào vi khuẩn. (4) Tạo DNA tái tổ hợp mang gene mã hóa insulin của người.", "options": [{"label": "A", "text": "(1) →(2) →(3) → (4)."}, {"label": "B", "text": "(2) →(4) → (3) → (1)."}, {"label": "C", "text": "(2) →(1) →(3) → (4)."}, {"label": "D", "text": "(1) → (4) → (3) → (2)."}]}, {"id": "BÀI 5. CÔNG NGHỆ GENE|mcq|22|228", "lesson": "BÀI 5. CÔNG NGHỆ GENE", "type": "mcq", "number": "22", "prompt": "Câu 22. Tạo các chủng vi khuẩn E.coli mang gene sản xuất hormone sinh trưởng (GH) ở động vật có vú là ứng dụng", "options": [{"label": "A", "text": "tạo giống bằng vi sinh vật tái tổ hợp."}, {"label": "B", "text": "nuôi cấy mô."}, {"label": "C", "text": "cấy truyền phôi."}, {"label": "D", "text": "nhân bản vô tính động vật."}]}, {"id": "BÀI 5. CÔNG NGHỆ GENE|mcq|23|229", "lesson": "BÀI 5. CÔNG NGHỆ GENE", "type": "mcq", "number": "23", "prompt": "Câu 23. Tạo các chủng vi khuẩn E.coli mang gene sản xuất vaccine là ứng dụng", "options": [{"label": "A", "text": "tạo giống bằng vi sinh vật tái tổ hợp."}, {"label": "B", "text": "Nuôi cấy mô."}, {"label": "C", "text": "Cấy truyền phôi."}, {"label": "D", "text": "Nhân bản vô tính động vật"}]}, {"id": "BÀI 5. CÔNG NGHỆ GENE|mcq|24|230", "lesson": "BÀI 5. CÔNG NGHỆ GENE", "type": "mcq", "number": "24", "prompt": "Câu 24. Người ta dùng kĩ thuật chuyển gene để chuyển gene kháng thuốc kháng sinh tetracyclin vào vi khuẩn E.coli không mang gene kháng thuốc kháng sinh. Để xác định đúng dòng vi khuẩn mang DNA tái tổ hợp mong muốn, người ta đem nuôi dòng vi khuẩn này trong một môi trường có nồng độ tetracyclin thích hợp. Dòng vi khuẩn mang DNA tái tổ hợp mong muốn sẽ", "options": [{"label": "A", "text": "sinh trưởng và phát triển bình thường."}, {"label": "B", "text": "tồn tại một thời gian nhưng không sinh trưởng và phát triển."}, {"label": "C", "text": "sinh trưởng và phát triển bình thường khi thêm vào môi trường một loại thuốc kháng sinh khác."}, {"label": "D", "text": "bị tiêu diệt hoàn toàn."}]}, {"id": "BÀI 5. CÔNG NGHỆ GENE|mcq|25|231", "lesson": "BÀI 5. CÔNG NGHỆ GENE", "type": "mcq", "number": "25", "prompt": "Câu 25. Trong công nghệ gene, để đưa gene tổng hợp insulin của người vào vi khuẩn E.coli, người ta đã sử dụng thể truyền là", "options": [{"label": "A", "text": "tế bào thực vật."}, {"label": "B", "text": "tế bào động vật."}, {"label": "C", "text": "nấm"}, {"label": "D", "text": "plasmid."}]}, {"id": "BÀI 5. CÔNG NGHỆ GENE|mcq|26|232", "lesson": "BÀI 5. CÔNG NGHỆ GENE", "type": "mcq", "number": "26", "prompt": "Câu 26. Giống lúa “gạo vàng” c t": "Sinh vật biến đổi gene chỉ có ở thực vật, không có ở động vật."}]}, {"id": "BÀI 5. CÔNG NGHỆ GENE|tf|4|240", "lesson": "BÀI 5. CÔNG NGHỆ GENE", "type": "tf", "number": "4", "prompt": "Khi nói về thành tựu công nghệ gene, mỗi nhận định sau đây là đúng hay sai?", "statements": [{"label": "a", "text": "Tạo giống bông kháng sâu bệnh bằng cách chuyển gene trừ sâu từ vi khuẩn vào cây bông."}, {"label": "b", "text": "Tạo ra giống lúa “gạo vàng” có khả năng tổng hợp β - carotene."}, {"label": "c", "text": "Tạo giống dâu tằm tam bội có năng suất lá cao."}, {"label": "d", "text": "Tạo cây pomato - cây lai giữa khoai tây và cà chua."}]}, {"id": "BÀI 5. CÔNG NGHỆ GENE|tf|6|241", "lesson": "BÀI 5. CÔNG NGHỆ GENE", "type": "tf", "number": "6", "prompt": "Hình dưới mô tả một giai đoạn của nguyên lí tạo động vật biến đổi gene. Theo lý thuyết, mỗi nhận", "statements": [{"label": "a", "text": "Giai đoạn này tạo giao tử mang gene cần chuyển."}, {"label": "b", "text": "[3] là bò cho trứng, [5] là hợp tử mang gene cần chuyển."}, {"label": "c", "text": "Mục tiêu phương pháp này tạo ra bò mang tính trạng tốt từ (2) để tạo ra sản phầm cần thiết từ gene đó mà bằng phương pháp lai thông thường không thể tạo ra được."}, {"label": "d", "text": "Số [2] có thể một gene từ sinh vật khác, có thể khác loài, cũng có thể là gene tổng hợp nhân tạo dựa trên trình tự nucleotide mà có thể sinh ra sản phẩm có ý nghĩa."}]}, {"id": "BÀI 5. CÔNG NGHỆ GENE|tf|7|242", "lesson": "BÀI 5. CÔNG NGHỆ GENE", "type": "tf", "number": "7", "prompt": "Hình dưới mô tả một giai đoạn của nguyên lí tạo động vật biến đổi gene. Theo lý thuyết, mỗi nhận", "statements": [{"label": "a", "text": "[4] là giai đoạn tiêm dung dịch chứa gene cần chuyển vào hợp tử ở giai đoạn nhân non."}, {"label": "b", "text": "[6] là giai đoạn nuôi cấy."}, {"label": "c", "text": "[7] là giai đoạn cấy phôi vào bò mẹ."}, {"label": "d", "text": "Số [8] mang phôi có gene cần chuyển từ số [2]."}]}, {"id": "BÀI 5. CÔNG NGHỆ GENE|tf|8|243", "lesson": const $=id=>document.getElementById(id);
let pool=[], answers={};
const lessonNames=[...new Set(DATA.map(q=>q.lesson))];
lessonNames.forEach((name,i)=>{let o=document.createElement('option');o.value=name;o.textContent=name;$('lesson').appendChild(o)});
function shuffleArray(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function refresh(){let lesson=$('lesson').value,kind=$('kind').value;
pool=shuffleArray(DATA.filter(q=>(lesson==='all'||q.lesson===lesson)&&(kind==='all'||q.type===kind)).slice());
answers={};render()}
function render(){ $('count').textContent=`${pool.length} câu trong lượt ôn`; $('progress').textContent=`Đã trả lời: ${Object.keys(answers).length}`;
const root=$('questions');root.innerHTML='';
if(!pool.length){root.innerHTML='<div class="card empty">Không có câu nào trong bộ lọc này.</div>';return}
pool.forEach((q,idx)=>{let card=document.createElement('section');card.className='card';
let top=document.createElement('div');top.className='topline';top.innerHTML=`<span>${q.lesson} · Câu gốc ${q.number}</span><span class="tag">${q.type==='mcq'?'Nhiều lựa chọn':'Đúng / Sai'}</span>`;card.appendChild(top);
let prompt=document.createElement('div');prompt.className='prompt';prompt.textContent=q.prompt;card.appendChild(prompt);
let group='q'+idx;
if(q.type==='mcq'){q.options.forEach((op,j)=>{let lab=document.createElement('label');lab.className='option';lab.innerHTML=`<input type="radio" name="${group}" value="${j}"><span class="optlabel">${op.label}.</span><span></span>`;lab.lastChild.textContent=op.text;card.appendChild(lab)})}
else {q.statements.forEach((st,j)=>{let wrap=document.createElement('div');wrap.className='statement';let content=document.createElement('div');content.style.flex='1';content.innerHTML=`<strong>${st.label.toUpperCase()})</strong> `;content.append(document.createTextNode(st.text));let controls=document.createElement('div');controls.style.cssText='display:flex;gap:10px;white-space:nowrap';['Đúng','Sai'].forEach((v,k)=>{let l=document.createElement('label');l.style.cssText='display:flex;align-items:center;gap:4px;font-size:14px';l.innerHTML=`<input type="radio" name="${group}_${j}" value="${k===0?'true':'false'}">${v}`;controls.appendChild(l)});wrap.append(content,controls);card.appendChild(wrap)})}
let act=document.createElement('div');act.className='actions';let check=document.createElement('button');check.className='primary';check.textContent='Lưu câu trả lời';let clear=document.createElement('button');clear.textContent='Bỏ chọn';act.append(check,clear);card.appendChild(act);
